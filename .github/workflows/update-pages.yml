name: 定时抓取并更新静态站点

# 定时（UTC 00:00 = 北京时间 08:00）抓取官方政策与曝光台，导出静态 JSON 并发布到 GitHub Pages；
# 也可在仓库 Actions 页面手动触发（workflow_dispatch）。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖包
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 探测大模型连通性（不阻断流程）
        working-directory: backend
        env:
          LLM_ENABLED: ${{ secrets.LLM_ENABLED || '0' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || '' }}
        run: |
          python - <<'PY'
          import os, time, json, urllib.request, urllib.error
          base = os.environ.get("LLM_BASE_URL") or "https://open.bigmodel.cn/api/paas/v4"
          key = os.environ.get("LLM_API_KEY", "")
          model = os.environ.get("LLM_MODEL") or "glm-4-flash"
          if not key:
              print("[LLM-PROBE] 未配置 LLM_API_KEY，跳过探测")
              raise SystemExit(0)
          body = {"model": model, "messages": [{"role": "user", "content": "回复ok"}], "temperature": 0}
          req = urllib.request.Request(
              base.rstrip("/") + "/chat/completions",
              data=json.dumps(body).encode("utf-8"),
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
              method="POST",
          )
          t = time.time()
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  d = json.load(r)
              print(f"[LLM-PROBE] 成功 HTTP {r.status} 耗时 {time.time()-t:.1f}s 回复={d['choices'][0]['message']['content'][:40]}")
          except urllib.error.HTTPError as e:
              print(f"[LLM-PROBE] HTTP {e.code} {e.read().decode('utf-8')[:200]}")
          except Exception as e:
              print(f"[LLM-PROBE] 网络/超时失败：{type(e).__name__} {e}")
          PY

      - name: 抓取政策与曝光并导出静态数据
        working-directory: backend
        env:
          # 默认关闭大模型、走规则解读；如需启用，在仓库 Secrets 配置 LLM_API_KEY 等
          LLM_ENABLED: ${{ secrets.LLM_ENABLED || '0' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || '' }}
        run: python run_pipeline.py

      - name: 回提交更新后的静态数据快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/data
          git commit -m "chore(data): 定时更新政策快照" || echo "无数据变更，跳过提交"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: enable

      - name: 上传站点产物（frontend）
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
